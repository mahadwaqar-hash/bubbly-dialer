name: Build Android APK

    on:
      push:
        branches: [ main, master ]
      pull_request:
        branches: [ main, master ]
      workflow_dispatch:

    jobs:
      build:
        name: Build BubblyDialer APK
        runs-on: ubuntu-latest

        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 20

          - name: Setup Java JDK 17
            uses: actions/setup-java@v4
            with:
              distribution: 'zulu'
              java-version: 17

          - name: Install NPM Dependencies
            run: npm install

          - name: Prepare Web Assets
            run: npm run build

          - name: Add Capacitor Android Platform
            run: npx cap add android

          - name: Inject Custom Dialer & Interceptor
  Configuration
            run: |
              if [ -f "AndroidManifest.xml" ]; then
                cp -f AndroidManifest.xml
  android/app/src/main/AndroidManifest.xml
              elif [ -f "android-custom/AndroidManifest.xml" ];
  then
                cp -f android-custom/AndroidManifest.xml
  android/app/src/main/AndroidManifest.xml
              fi
              mkdir -p
  android/app/src/main/java/com/bubblydialer/crm/
              if [ -f "MainActivity.java" ]; then
                cp -f MainActivity.java
  android/app/src/main/java/com/bubblydialer/crm/MainActivity.
  java
              elif [ -f "android-custom/MainActivity.java" ];
  then
                cp -f android-custom/MainActivity.java
  android/app/src/main/java/com/bubblydialer/crm/MainActivity.
  java
              fi

          - name: Sync Web Assets to Native Android
            run: npx cap sync android

          - name: Build Debug APK with Gradle
            working-directory: android
            run: |
              chmod +x gradlew
              ./gradlew assembleDebug --no-daemon

          - name: Upload Compiled APK
            uses: actions/upload-artifact@v4
            with:
              name: BubblyDialer-Debug-APK
              path: android/app/build/outputs/apk/debug/app-
  debug.apk
              retention-days: 30
